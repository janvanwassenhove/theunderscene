name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes by pushing the built site to the `gh-pages` branch.
#
# The newer artifact flow (actions/configure-pages + actions/deploy-pages) is
# tidier, but it cannot create the Pages site itself: on a repository where
# Pages has never been switched on it fails with "Resource not accessible by
# integration", because the workflow token may not create the site. Branch-based
# publishing has no such requirement, so this route works on a fresh repository
# without anybody visiting the settings page first.
#
# GitHub Pages serves this repo from /theunderscene/, which is what
# vite.config.ts sets as `base`. Publishing from anywhere else needs VITE_BASE.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # .nojekyll stops Pages running the output through Jekyll, which would
      # otherwise drop any path beginning with an underscore.
      - run: touch dist/.nojekyll

      - name: Push the built site to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
